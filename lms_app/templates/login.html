<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMAD oLearn</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, var(--simad-blue) 0%, #003366 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <div class="brand" style="justify-content: center; margin-bottom: 8px;">
                SIMAD <span>oLearn</span>
            </div>
            <p style="color: #666;">Distance Learning Portal</p>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="std@simad.edu.so" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label">I am a...</label>
                <select name="role" class="form-control">
                    <option value="student">Student</option>
                    <option value="instructor">Instructor</option>
                </select>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 16px;">Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
            <a href="#" style="color: var(--simad-blue);">Forgot Password?</a>
        </p>
    </div>

</body>

</html>
