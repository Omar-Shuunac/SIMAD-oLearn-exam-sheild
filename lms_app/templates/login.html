<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SIMAD oLearn</title>
    <meta name="description" content="Sign in to SIMAD University's oLearn distance learning portal.">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, var(--simad-blue) 0%, #003366 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: 44px 40px;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .error-box {
            background: #fff0f0;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 20px;
        }

        .success-box {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #15803d;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <div class="brand" style="justify-content: center; margin-bottom: 10px;">
                SIMAD <span>oLearn</span>
            </div>
            <p style="color: #666; font-size: 0.9rem;">Distance Learning Portal</p>
        </div>

        {% if error %}
        <div class="error-box">⚠️ {{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="{{ 'success-box' if category == 'success' else 'error-box' }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form action="/login" method="POST" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="yourname@simad.edu.so"
                    required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••"
                    required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn-primary"
                style="width: 100%; margin-top: 16px; padding: 14px;">
                Sign In →
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
            <p style="font-size: 0.9rem; color: #666;">
                New student?
                <a href="{{ url_for('register') }}" style="color: var(--simad-blue); font-weight: 600;">
                    Create an account
                </a>
            </p>
            <a href="#" style="color: #aaa; font-size: 0.82rem;">Forgot Password?</a>
        </div>
    </div>
</body>

</html>
